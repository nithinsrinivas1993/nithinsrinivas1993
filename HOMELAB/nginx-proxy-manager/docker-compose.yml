version: "3.9"

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped

    ports:
      - "80:80"     # HTTP (public entry)
      - "81:81"     # Admin UI
      - "443:443"   # HTTPS

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
