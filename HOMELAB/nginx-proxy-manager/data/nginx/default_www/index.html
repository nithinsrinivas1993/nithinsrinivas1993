<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nithin's Home Lab</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 32px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      background: #374151;
    }

    .card a {
      text-decoration: none;
      color: white;
      font-size: 18px;
      display: block;
      margin-top: 10px;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #9ca3af;
    }

    .online {
      color: #10b981;
    }

    .offline {
      color: #ef4444;
    }

    .footer {
      margin-top: 50px;
      font-size: 14px;
      color: #9ca3af;
    }

    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>🚀 Nithin's Home Lab</h1>

  <div class="container">

    <div class="card">
      <div>🛡️ Pi-hole</div>
      <a href="http://pihole.home">Open</a>
      <div id="pihole-status" class="status">Checking...</div>
    </div>

    <div class="card">
      <div>📊 Uptime Kuma</div>
      <a href="http://kuma.home">Open</a>
      <div id="kuma-status" class="status">Checking...</div>
    </div>

  </div>

  <div class="footer">
    👉 Nginx Proxy Manager:
    <a href="http://192.168.18.24:81">Open UI</a>
  </div>

  <script>
    async function checkService(url, elementId) {
      try {
        await fetch(url, { mode: 'no-cors' });
        document.getElementById(elementId).innerText = "● Online";
        document.getElementById(elementId).classList.add("online");
      } catch {
        document.getElementById(elementId).innerText = "● Offline";
        document.getElementById(elementId).classList.add("offline");
      }
    }

    // Run checks
    checkService("http://pihole.home", "pihole-status");
    checkService("http://kuma.home", "kuma-status");
  </script>

</body>
</html>
